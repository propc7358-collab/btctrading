[project]
name = "quant"
version = "0.1.0"
description = "Swing-strategy research harness for OKX perpetuals: US stocks, Taiwan exposure, metals, commodities"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "pandas>=2.2",
    "pyarrow>=18",
]

[dependency-groups]
dev = [
    "mypy>=1.13",
    "pandas-stubs>=2.2",
    "pytest>=8.3",
    "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quant"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "ERA", "PD", "NPY", "PGH", "T20", "DTZ"]
ignore = ["PD010", "PD013", "RUF001"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["T20"]
"tools/*" = ["T20"]
"quant/**/cli.py" = ["T20"]

[tool.mypy]
strict = true
python_version = "3.12"
packages = ["quant", "tools"]

[[tool.mypy.overrides]]
module = ["pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
