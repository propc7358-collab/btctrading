<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>投資水位紀錄</title>
<style>
  :root {
    color-scheme: light;
    --page: #f9f9f7;
    --surface: #fcfcfb;
    --surface-2: #f3f2ef;
    --ink: #0b0b0b;
    --ink-2: #52514e;
    --muted: #898781;
    --grid: #e1e0d9;
    --axis: #c3c2b7;
    --border: rgba(11,11,11,0.10);
    --accent: #2a78d6;
    --accent-ink: #ffffff;
    --series-value: #2a78d6;
    --series-cost: #eb6834;
    /* 台灣慣例：紅漲綠跌 */
    --up: #c62f2f;
    --down: #006300;
    --danger: #d03b3b;
    --focus: #2a78d6;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --page: #0d0d0d;
      --surface: #1a1a19;
      --surface-2: #232321;
      --ink: #f0efec;
      --ink-2: #c3c2b7;
      --muted: #898781;
      --grid: #2c2c2a;
      --axis: #383835;
      --border: rgba(255,255,255,0.10);
      --accent: #3987e5;
      --series-value: #3987e5;
      --series-cost: #d95926;
      --up: #e66767;
      --down: #0ca30c;
      --danger: #e66767;
      --focus: #3987e5;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --page: #0d0d0d;
    --surface: #1a1a19;
    --surface-2: #232321;
    --ink: #f0efec;
    --ink-2: #c3c2b7;
    --muted: #898781;
    --grid: #2c2c2a;
    --axis: #383835;
    --border: rgba(255,255,255,0.10);
    --accent: #3987e5;
    --series-value: #3987e5;
    --series-cost: #d95926;
    --up: #e66767;
    --down: #0ca30c;
    --danger: #e66767;
    --focus: #3987e5;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--page);
    color: var(--ink);
    font: 15px/1.5 system-ui, -apple-system, "Segoe UI", "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
  }
  .wrap { max-width: 1040px; margin: 0 auto; padding: 24px 16px 64px; }
  header.top { display: flex; flex-wrap: wrap; gap: 12px; align-items: flex-end; justify-content: space-between; margin-bottom: 20px; }
  h1 { font-size: 22px; margin: 0; letter-spacing: .01em; }
  .sub { color: var(--muted); font-size: 13px; margin-top: 2px; }
  h2 { font-size: 16px; margin: 0; }
  .toolbar { display: flex; flex-wrap: wrap; gap: 8px; }

  button, .btn {
    font: inherit; font-size: 14px; cursor: pointer;
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    padding: 7px 12px; border-radius: 8px; line-height: 1.2;
  }
  button:hover { background: var(--surface-2); }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: transparent; }
  button.primary:hover { filter: brightness(1.06); background: var(--accent); }
  button.ghost { background: transparent; border-color: transparent; color: var(--ink-2); padding: 4px 8px; }
  button.ghost:hover { background: var(--surface-2); color: var(--ink); }
  button.danger { color: var(--danger); }
  button:focus-visible, input:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

  .card { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 18px; margin-bottom: 16px; }
  .card-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; margin-bottom: 12px; }
  .card-head .meta { color: var(--muted); font-size: 13px; }

  /* Hero + KPI tiles */
  .hero { display: grid; grid-template-columns: 1.4fr 1fr; gap: 16px; align-items: stretch; }
  .hero-main .label { color: var(--ink-2); font-size: 14px; }
  .hero-main .value { font-size: 48px; font-weight: 700; line-height: 1.1; margin: 4px 0; letter-spacing: -.01em; }
  .hero-main .delta { font-size: 16px; font-weight: 600; }
  .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .tile { background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }
  .tile .label { color: var(--ink-2); font-size: 13px; }
  .tile .value { font-size: 20px; font-weight: 650; }
  .tile .hint { color: var(--muted); font-size: 12px; }
  .level-bar { height: 8px; border-radius: 4px; background: var(--grid); overflow: hidden; margin-top: 6px; }
  .level-bar > i { display: block; height: 100%; background: var(--accent); border-radius: 4px; }

  .up { color: var(--up); }
  .down { color: var(--down); }

  /* Tables */
  .table-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; }
  table { width: 100%; border-collapse: collapse; font-size: 14px; }
  th, td { padding: 9px 8px; text-align: right; border-bottom: 1px solid var(--grid); white-space: nowrap; }
  th { color: var(--muted); font-weight: 500; font-size: 13px; }
  th:first-child, td:first-child { text-align: left; white-space: normal; }
  td.num, th.num { font-variant-numeric: tabular-nums; }
  tfoot td { font-weight: 650; border-bottom: none; border-top: 1px solid var(--axis); }
  td.actions { width: 1%; }
  .fund-name { font-weight: 550; }
  .tag { display: inline-block; font-size: 11px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 1px; }

  .platform { margin-bottom: 16px; }
  .platform:last-child { margin-bottom: 0; }
  .platform-title { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; margin: 4px 0 6px; }
  .platform-title strong { font-size: 15px; }
  .platform-title .meta { color: var(--muted); font-size: 13px; }

  /* Charts */
  .legend { display: flex; flex-wrap: wrap; gap: 14px; font-size: 13px; color: var(--ink-2); margin-bottom: 8px; }
  .legend .key { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw-rect { width: 12px; height: 10px; border-radius: 2px; display: inline-block; }
  .legend .sw-line { width: 16px; height: 2px; display: inline-block; border-radius: 1px; }
  .legend .sw-tick { width: 3px; height: 12px; display: inline-block; border-radius: 1px; }
  .chart { position: relative; width: 100%; }
  .chart svg { display: block; width: 100%; height: auto; overflow: visible; }
  .chart text { font-family: inherit; }
  .empty { color: var(--muted); font-size: 14px; padding: 16px 0; }
  .tooltip {
    position: absolute; pointer-events: none; z-index: 5;
    background: var(--surface); color: var(--ink); border: 1px solid var(--border);
    box-shadow: 0 4px 16px rgba(0,0,0,.12); border-radius: 8px; padding: 8px 10px; font-size: 13px;
    min-width: 150px; opacity: 0; transition: opacity .08s;
  }
  .tooltip.show { opacity: 1; }
  .tooltip .tt-title { color: var(--ink-2); font-size: 12px; margin-bottom: 4px; }
  .tooltip .tt-row { display: flex; align-items: center; gap: 8px; justify-content: space-between; }
  .tooltip .tt-row .k { display: inline-flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .tooltip .tt-row .k i { width: 12px; height: 2px; display: inline-block; border-radius: 1px; }
  .tooltip .tt-row b { font-variant-numeric: tabular-nums; }
  .bar-hit { cursor: default; }
  .bar-hit:focus { outline: none; }
  .bar-hit:hover .bar, .bar-hit:focus .bar { filter: brightness(1.12); }

  .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  .grid-2 > .card { margin-bottom: 0; }

  .note { color: var(--muted); font-size: 12px; margin-top: 8px; }
  .warn { color: var(--danger); font-size: 12px; margin: 2px 0 6px; }
  .changes { font-size: 13px; color: var(--ink-2); white-space: normal; text-align: left; min-width: 12em; }
  #logTable th:first-child, #logTable td:first-child { white-space: nowrap; }
  select.inline { font: inherit; font-size: 13px; padding: 4px 8px; border-radius: 8px; border: 1px solid var(--axis); background: var(--surface); color: var(--ink); max-width: 100%; }
  .pill { display: inline-block; font-size: 12px; color: var(--ink-2); background: var(--surface-2); border-radius: 999px; padding: 1px 8px; }

  @media (max-width: 760px) {
    .hero, .grid-2 { grid-template-columns: 1fr; }
    .hero-main .value { font-size: 40px; }
    .hide-sm { display: none; }
    table.holdings thead { display: none; }
    table.holdings tr { display: grid; grid-template-columns: repeat(4, 1fr); align-items: end; border-bottom: 1px solid var(--grid); padding: 8px 0; }
    table.holdings td { border: none; padding: 2px 4px; }
    table.holdings td:first-child { grid-column: 1 / -1; padding-bottom: 4px; }
    table.holdings td[data-label]::before { content: attr(data-label); display: block; font-size: 11px; color: var(--muted); font-weight: 400; }
    table.holdings tfoot tr { border-bottom: none; border-top: 1px solid var(--axis); }
    table.holdings tfoot td { border-top: none; }
  }
  @media print {
    .toolbar, .actions, button { display: none !important; }
    .card { break-inside: avoid; }
  }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>投資水位紀錄</h1>
      <div class="sub" id="updatedAt"></div>
    </div>
  </header>

  <!-- 總覽 -->
  <section class="card hero" aria-label="總覽">
    <div class="hero-main">
      <div class="label">總參考現值（TWD）</div>
      <div class="value" id="kpiValue">—</div>
      <div class="delta" id="kpiDelta">—</div>
      <div class="sub" id="kpiCount"></div>
    </div>
    <div class="tiles">
      <div class="tile">
        <div class="label">投入本金</div>
        <div class="value" id="kpiCost">—</div>
      </div>
      <div class="tile">
        <div class="label">未實現損益</div>
        <div class="value" id="kpiPnl">—</div>
      </div>
      <div class="tile">
        <div class="label">較上次紀錄（淨值變動）</div>
        <div class="value" id="kpiChange">—</div>
        <div class="hint" id="kpiChangeHint"></div>
      </div>
      <div class="tile">
        <div class="label">投資水位</div>
        <div class="value" id="kpiLevel">—</div>
        <div class="level-bar" aria-hidden="true"><i id="kpiLevelBar" style="width:0"></i></div>
        <div class="hint" id="kpiLevelHint"></div>
      </div>
    </div>
  </section>

  <!-- 持有明細 -->
  <section class="card" aria-label="持有明細">
    <div class="card-head">
      <h2>持有明細</h2>
      <span class="meta">各帳戶最新一筆截圖</span>
    </div>
    <div id="accounts"></div>
    <div class="note">「較上次」是扣除加碼／減碼後的淨值變動，等於（本次現值 − 新投入）÷ 上次現值 − 1。</div>
  </section>

  <div class="grid-2">
    <section class="card" aria-label="依基金合併">
      <div class="card-head">
        <h2>依基金合併</h2>
        <span class="meta">跨帳戶同名基金合計</span>
      </div>
      <div class="legend">
        <span class="key"><span class="sw-rect" style="background:var(--series-value)"></span>參考現值</span>
        <span class="key"><span class="sw-tick" style="background:var(--series-cost)"></span>本金</span>
      </div>
      <div class="chart" id="fundChart"></div>
    </section>

    <section class="card" aria-label="配置比例">
      <div class="card-head">
        <h2>配置比例</h2>
        <span class="meta">占總現值</span>
      </div>
      <div id="allocTables"></div>
    </section>
  </div>

  <!-- 走勢 -->
  <section class="card" aria-label="水位走勢" style="margin-top:16px">
    <div class="card-head">
      <h2>水位走勢</h2>
      <select class="inline" id="trendFund" aria-label="選擇走勢範圍"></select>
    </div>
    <div class="legend">
      <span class="key"><span class="sw-line" style="background:var(--series-value)"></span>參考現值</span>
      <span class="key"><span class="sw-line" style="background:var(--series-cost)"></span>投入本金</span>
    </div>
    <div class="chart" id="trendChart"></div>
    <div class="table-wrap" style="margin-top:12px">
      <table id="trendTable">
        <thead>
          <tr><th>日期</th><th class="num">參考現值</th><th class="num">投入本金</th><th class="num">損益</th><th class="num">報酬率</th><th class="num">淨值變動</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
    <div class="note">某天只更新了部分帳戶時，其他帳戶沿用各自最近一次的截圖。</div>
  </section>

  <!-- 紀錄 -->
  <section class="card" aria-label="截圖紀錄">
    <div class="card-head">
      <h2>截圖紀錄</h2>
      <span class="meta" id="logMeta"></span>
    </div>
    <div class="table-wrap">
      <table id="logTable">
        <thead>
          <tr><th>日期</th><th>帳戶</th><th class="num">現值</th><th class="num">本金</th><th class="num">淨值損益</th><th class="changes">持股變動</th></tr>
        </thead>
        <tbody></tbody>
      </table>
    </div>
  </section>
</div>

<script src="data.js"></script>
<script>
(function () {
  'use strict';

  const D = window.PORTFOLIO || { settings: {}, accounts: [], funds: {}, records: [] };
  D.settings = D.settings || {};
  D.funds = D.funds || {};
  const records = (D.records || []).slice().sort((a, b) => a.date.localeCompare(b.date));

  // ---------- helpers ----------
  const $ = (id) => document.getElementById(id);
  const nf = new Intl.NumberFormat('zh-TW', { maximumFractionDigits: 0 });
  const fmt = (n) => nf.format(Math.round(n));
  const signed = (n) => (Math.round(n) > 0 ? '+' : Math.round(n) < 0 ? '−' : '') + nf.format(Math.abs(Math.round(n)));
  const pct = (r, digits = 2) => (r > 0 ? '+' : r < 0 ? '−' : '') + Math.abs(r * 100).toFixed(digits) + '%';
  const tone = (n) => (n > 0.5 ? 'up' : n < -0.5 ? 'down' : '');
  const toneR = (r) => (r > 0 ? 'up' : r < 0 ? 'down' : '');
  const sl = (d) => d.replace(/-/g, '/');
  const el = (tag, attrs, ...kids) => {
    const n = document.createElement(tag);
    if (attrs) for (const k in attrs) {
      if (k === 'class') n.className = attrs[k];
      else if (k === 'text') n.textContent = attrs[k];
      else n.setAttribute(k, attrs[k]);
    }
    for (const c of kids) if (c != null) n.append(c);
    return n;
  };
  const SVGNS = 'http://www.w3.org/2000/svg';
  const sv = (tag, attrs) => {
    const n = document.createElementNS(SVGNS, tag);
    if (attrs) for (const k in attrs) n.setAttribute(k, attrs[k]);
    return n;
  };
  function compactTWD(n) {
    const a = Math.abs(n);
    if (a >= 1e8) return (n / 1e8).toFixed(a >= 1e9 ? 0 : 1) + '億';
    if (a >= 1e4) return (n / 1e4).toFixed(a >= 1e5 ? 0 : 1) + '萬';
    return nf.format(n);
  }
  function niceStep(range, ticks) {
    const raw = range / ticks;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const r = raw / mag;
    return (r <= 1 ? 1 : r <= 2 ? 2 : r <= 2.5 ? 2.5 : r <= 5 ? 5 : 10) * mag;
  }
  const accName = (id) => (D.accounts.find((a) => a.id === id) || { name: id }).name;
  const planFor = (accountId, fund) => ((D.accounts.find((a) => a.id === accountId) || {}).plans || []).find((p) => p.fund === fund && p.status !== '終止');
  const sum = (list, k) => list.reduce((s, h) => s + (+h[k] || 0), 0);
  function totals(list) {
    const value = sum(list, 'value'), cost = sum(list, 'cost');
    return { value, cost, pnl: value - cost, rate: cost ? (value - cost) / cost : 0 };
  }

  // ---------- 資料推導 ----------
  // 每個帳戶在某日（含）以前最新的一筆紀錄
  function latestAsOf(accountId, date) {
    let r = null;
    for (const x of records) if (x.account === accountId && x.date <= date) r = x;
    return r;
  }
  function prevRecord(rec) {
    let r = null;
    for (const x of records) { if (x === rec) break; if (x.account === rec.account) r = x; }
    return r;
  }
  const accountIds = [...new Set([...D.accounts.map((a) => a.id), ...records.map((r) => r.account)])];
  const lastDate = records.length ? records[records.length - 1].date : null;
  const currentRecords = accountIds.map((id) => latestAsOf(id, lastDate || '9999')).filter(Boolean);
  const currentHoldings = currentRecords.flatMap((r) => r.holdings.map((h) => ({ ...h, account: r.account, recDate: r.date })));

  // 兩筆紀錄間的變動：淨值損益 = 現值變化 − 本金變化
  function diffRecords(prev, cur) {
    const out = { navGain: 0, flow: 0, changes: [] };
    if (!prev) { out.first = true; return out; }
    const pm = new Map(prev.holdings.map((h) => [h.name, h]));
    const cm = new Map(cur.holdings.map((h) => [h.name, h]));
    let pv = 0, cv = 0;
    for (const [name, h] of cm) {
      const p = pm.get(name);
      if (!p) { out.changes.push('新增 ' + name + '（' + fmt(h.cost) + '）'); out.flow += h.cost; continue; }
      const dc = h.cost - p.cost;
      if (Math.abs(dc) >= 1) { out.changes.push((dc > 0 ? (planFor(cur.account, name) ? '定期定額 ' : '加碼 ') : '減碼 ') + name + ' ' + signed(dc)); }
      out.flow += dc; pv += p.value; cv += h.value;
    }
    for (const [name, p] of pm) if (!cm.has(name)) { out.changes.push('出清 ' + name); out.flow -= p.cost; }
    // 只拿兩次都持有的部位算淨值損益
    let flowKept = 0;
    for (const [name, h] of cm) { const p = pm.get(name); if (p) flowKept += h.cost - p.cost; }
    out.navGain = cv - pv - flowKept;
    out.navRate = pv ? (cv - flowKept) / pv - 1 : 0;
    return out;
  }
  // 單一持有相對同帳戶上一筆的淨值變動率
  function holdingNavChange(rec, h) {
    const prev = prevRecord(rec);
    if (!prev) return null;
    const p = prev.holdings.find((x) => x.name === h.name);
    if (!p || !p.value) return { isNew: true };
    return { rate: (h.value - (h.cost - p.cost)) / p.value - 1, since: prev.date };
  }

  // 依日期合併所有帳戶（某帳戶當天沒更新就沿用最近一筆）
  // fundName 有值時只看該基金
  function series(fundName) {
    const dates = [...new Set(records.map((r) => r.date))];
    const pts = [];
    let prevMap = null;
    for (const d of dates) {
      const map = new Map();
      for (const id of accountIds) {
        const r = latestAsOf(id, d);
        if (!r) continue;
        for (const h of r.holdings) {
          if (fundName && h.name !== fundName) continue;
          map.set(id + '|' + h.name, h);
        }
      }
      if (!map.size) { prevMap = map; continue; }
      const list = [...map.values()];
      const t = totals(list);
      let navRate = null;
      if (prevMap && prevMap.size) {
        let pv = 0, cv = 0, flow = 0;
        for (const [k, h] of map) { const p = prevMap.get(k); if (p) { pv += p.value; cv += h.value; flow += h.cost - p.cost; } }
        if (pv) navRate = (cv - flow) / pv - 1;
      }
      pts.push({ date: d, value: t.value, cost: t.cost, navRate });
      prevMap = map;
    }
    return pts;
  }

  // ---------- render ----------
  function render() {
    $('updatedAt').textContent = lastDate ? '最新截圖 ' + sl(lastDate) + ' · 共 ' + records.length + ' 筆紀錄' : '尚無紀錄';
    const t = totals(currentHoldings);
    $('kpiValue').textContent = fmt(t.value);
    const delta = $('kpiDelta');
    delta.textContent = signed(t.pnl) + '（' + pct(t.rate) + '）';
    delta.className = 'delta ' + tone(t.pnl);
    $('kpiCount').textContent = currentRecords.length + ' 個帳戶 · ' + currentHoldings.length + ' 筆持有';
    $('kpiCost').textContent = fmt(t.cost);
    const pnl = $('kpiPnl'); pnl.textContent = signed(t.pnl); pnl.className = 'value ' + tone(t.pnl);

    const all = series(null);
    const ch = $('kpiChange');
    if (all.length >= 2) {
      const a = all[all.length - 2], b = all[all.length - 1];
      const flow = b.cost - a.cost;
      const nav = b.value - a.value - flow;
      ch.textContent = signed(nav); ch.className = 'value ' + tone(nav);
      $('kpiChangeHint').textContent = '對比 ' + sl(a.date) + '（' + pct(b.navRate || 0) + '）' + (Math.abs(flow) >= 1 ? '，另有本金 ' + signed(flow) : '');
    } else {
      ch.textContent = '—'; ch.className = 'value';
      $('kpiChangeHint').textContent = '下次上傳截圖後開始計算';
    }

    const budget = +D.settings.budget || 0;
    if (budget > 0) {
      const lvl = t.cost / budget;
      $('kpiLevel').textContent = (lvl * 100).toFixed(1) + '%';
      $('kpiLevelBar').style.width = Math.min(100, lvl * 100) + '%';
      $('kpiLevelHint').textContent = '本金 ÷ 可投資資金 ' + fmt(budget) + (lvl < 1 ? '，尚可投入 ' + fmt(budget - t.cost) : '');
    } else {
      $('kpiLevel').textContent = '—';
      $('kpiLevelBar').style.width = '0';
      $('kpiLevelHint').textContent = '尚未設定可投資總資金';
    }

    renderAccounts();
    renderFundChart();
    renderAlloc();
    renderTrendSelect();
    renderTrend();
    renderLog();
  }

  function renderAccounts() {
    const host = $('accounts');
    host.replaceChildren();
    if (!currentRecords.length) { host.append(el('div', { class: 'empty', text: '尚無紀錄' })); return; }
    for (const rec of currentRecords) {
      const acc = D.accounts.find((a) => a.id === rec.account) || {};
      const t = totals(rec.holdings);
      const head = el('div', { class: 'platform-title' },
        el('strong', { text: acc.name || rec.account }),
        el('span', { class: 'meta', text: '· ' + rec.holdings.length + ' 檔 · 截圖 ' + sl(rec.date) }),
        acc.note ? el('span', { class: 'meta', text: '· ' + acc.note }) : null
      );
      const box = el('div', { class: 'platform' }, head);
      for (const p of acc.plans || []) {
        const bits = ['定期定額 ' + p.fund, (p.frequency === '每週' && /^週/.test(p.day || '') ? '每' + p.day : (p.frequency || '') + (p.day ? ' ' + p.day : '')) + ' 扣 ' + fmt(p.amount) + ' 元'];
        if (p.count != null) bits.push('已扣 ' + p.count + ' 次');
        if (p.next) bits.push('下次 ' + sl(p.next));
        if (p.status) bits.push(p.status);
        box.append(el('div', { class: 'meta', style: 'color:var(--ink-2);font-size:13px;margin:0 0 4px' }, el('span', { class: 'pill', text: '定期定額' }), document.createTextNode(' ' + bits.slice(0).join(' · ').replace(/^定期定額 /, ''))));
      }
      if (rec.reported) {
        const dv = Math.abs(rec.reported.value - t.value), dc = rec.reported.cost != null ? Math.abs(rec.reported.cost - t.cost) : 0;
        if (dv > 1 || dc > 1) box.append(el('div', { class: 'warn', text: '⚠ 明細加總和截圖上的帳戶合計不一致（現值 ' + fmt(rec.reported.value) + (rec.reported.cost != null ? '、本金 ' + fmt(rec.reported.cost) : '') + '）' }));
      }
      const tbody = el('tbody');
      for (const h of rec.holdings) {
        const pnl = h.value - h.cost;
        const rate = h.cost ? pnl / h.cost : 0;
        const nameCell = el('td', null, el('span', { class: 'fund-name', text: h.name }));
        const cat = (D.funds[h.name] || {}).category;
        if (cat) nameCell.append(el('span', { class: 'tag', text: cat }));
        if (h.dca || planFor(rec.account, h.name)) nameCell.append(el('span', { class: 'tag', text: '定期定額' }));
        const nc = holdingNavChange(rec, h);
        const ncCell = el('td', { class: 'num', 'data-label': '較上次' });
        if (!nc) ncCell.textContent = '—';
        else if (nc.isNew) ncCell.textContent = '新';
        else { ncCell.textContent = pct(nc.rate); ncCell.className += ' ' + toneR(nc.rate); ncCell.title = '對比 ' + sl(nc.since); }
        tbody.append(el('tr', null,
          nameCell,
          el('td', { class: 'num', 'data-label': '參考現值', text: fmt(h.value) }),
          el('td', { class: 'num hide-sm', text: fmt(h.cost) + (h.costDerived ? '*' : '') }),
          el('td', { class: 'num ' + tone(pnl), 'data-label': '損益', text: signed(pnl) }),
          el('td', { class: 'num ' + tone(pnl), 'data-label': '報酬率', text: pct(rate) }),
          ncCell,
          el('td', { class: 'num hide-sm', text: h.navDate ? h.navDate.slice(5).replace('-', '/') : '—' })
        ));
      }
      const tfoot = el('tfoot', null, el('tr', null,
        el('td', { text: '小計' }),
        el('td', { class: 'num', 'data-label': '參考現值', text: fmt(t.value) }),
        el('td', { class: 'num hide-sm', text: fmt(t.cost) }),
        el('td', { class: 'num ' + tone(t.pnl), 'data-label': '損益', text: signed(t.pnl) }),
        el('td', { class: 'num ' + tone(t.pnl), 'data-label': '報酬率', text: pct(t.rate) }),
        el('td'), el('td', { class: 'hide-sm' })
      ));
      const table = el('table', { class: 'holdings' },
        el('thead', null, el('tr', null,
          el('th', { text: '基金' }), el('th', { class: 'num', text: '參考現值' }), el('th', { class: 'num hide-sm', text: '本金' }),
          el('th', { class: 'num', text: '損益' }), el('th', { class: 'num', text: '報酬率' }), el('th', { class: 'num', text: '較上次' }), el('th', { class: 'num hide-sm', text: '淨值日' })
        )),
        tbody, tfoot
      );
      box.append(el('div', { class: 'table-wrap' }, table));
      if (rec.holdings.some((h) => h.costDerived)) box.append(el('div', { class: 'note', style: 'margin-top:4px', text: '* 截圖只顯示報酬率，本金由現值 ÷ (1 + 報酬率) 推算。' }));
      host.append(box);
    }
  }

  function aggregateByFund() {
    const map = new Map();
    for (const h of currentHoldings) {
      const cur = map.get(h.name) || { name: h.name, value: 0, cost: 0, accounts: [] };
      cur.value += +h.value || 0; cur.cost += +h.cost || 0;
      const an = accName(h.account);
      if (!cur.accounts.includes(an)) cur.accounts.push(an);
      map.set(h.name, cur);
    }
    return [...map.values()].sort((a, b) => b.value - a.value);
  }

  function ttRow(color, k, v, cls) {
    const key = el('span', { class: 'k' });
    if (color) { const i = el('i'); i.style.background = color; key.append(i); }
    key.append(document.createTextNode(k));
    return el('div', { class: 'tt-row' }, key, el('b', { class: cls || '', text: v }));
  }
  function placeTip(host, tip, px, py) {
    const box = host.getBoundingClientRect();
    tip.classList.add('show');
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let left = px + 14; if (left + tw > box.width) left = Math.max(0, px - tw - 14);
    let top = py - th - 10; if (top < 0) top = py + 16;
    tip.style.left = left + 'px'; tip.style.top = top + 'px';
  }

  // 水平長條：現值為長條，本金為刻度線
  function renderFundChart() {
    const host = $('fundChart');
    host.replaceChildren();
    const rows = aggregateByFund();
    if (!rows.length) { host.append(el('div', { class: 'empty', text: '沒有持有資料' })); return; }
    const W = Math.max(300, host.clientWidth || 480);
    const labelH = 18, barH = 14, gap = 16, rowH = labelH + barH + gap, padR = 8;
    const H = rows.length * rowH;
    const max = Math.max(...rows.map((r) => Math.max(r.value, r.cost))) * 1.02;
    const x = (v) => (v / max) * (W - padR);
    const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': '各基金參考現值與本金' });
    const tip = el('div', { class: 'tooltip' });
    rows.forEach((r, i) => {
      const y0 = i * rowH, by = y0 + labelH;
      const g = sv('g', { class: 'bar-hit', tabindex: '0' });
      const val = sv('text', { x: W - padR, y: y0 + 13, 'font-size': 12, fill: 'var(--ink-2)', 'text-anchor': 'end', style: 'font-variant-numeric:tabular-nums' });
      val.textContent = compactTWD(r.value) + ' · ' + pct(r.cost ? (r.value - r.cost) / r.cost : 0, 1);
      const label = sv('text', { x: 0, y: y0 + 13, 'font-size': 13, fill: 'var(--ink)' });
      label.textContent = r.name + (r.accounts.length > 1 ? '（' + r.accounts.length + ' 帳戶）' : '');
      g.append(val, label);
      g.append(sv('rect', { x: 0, y: by, width: W - padR, height: barH, rx: 4, fill: 'var(--grid)', opacity: .5 }));
      g.append(sv('rect', { class: 'bar', x: 0, y: by, width: Math.max(2, x(r.value)), height: barH, rx: 4, fill: 'var(--series-value)' }));
      const cx = x(r.cost);
      g.append(sv('rect', { x: cx - 2.5, y: by - 4, width: 5, height: barH + 8, rx: 2, fill: 'var(--surface)' }));
      g.append(sv('rect', { x: cx - 1.5, y: by - 3, width: 3, height: barH + 6, rx: 1.5, fill: 'var(--series-cost)' }));
      g.append(sv('rect', { x: 0, y: y0, width: W, height: rowH - 4, fill: 'transparent' }));
      const show = (evt) => {
        const pnl = r.value - r.cost;
        tip.replaceChildren(
          el('div', { class: 'tt-title', text: r.name }),
          ttRow('var(--series-value)', '參考現值', fmt(r.value)),
          ttRow('var(--series-cost)', '本金', fmt(r.cost)),
          ttRow(null, '損益', signed(pnl) + '（' + pct(r.cost ? pnl / r.cost : 0) + '）', tone(pnl)),
          el('div', { class: 'tt-title', style: 'margin:4px 0 0', text: r.accounts.join('、') })
        );
        const box = host.getBoundingClientRect();
        if (evt.type === 'focus') placeTip(host, tip, box.width / 2, by * box.width / W);
        else placeTip(host, tip, evt.clientX - box.left, evt.clientY - box.top);
      };
      g.addEventListener('pointermove', show);
      g.addEventListener('focus', show);
      g.addEventListener('pointerleave', () => tip.classList.remove('show'));
      g.addEventListener('blur', () => tip.classList.remove('show'));
      svg.append(g);
    });
    host.append(svg, tip);
  }

  function renderAlloc() {
    const host = $('allocTables');
    host.replaceChildren();
    const t = totals(currentHoldings);
    if (!t.value) { host.append(el('div', { class: 'empty', text: '沒有持有資料' })); return; }
    const groups = [
      ['帳戶', (h) => accName(h.account)],
      ['類別', (h) => (D.funds[h.name] || {}).category || '未分類']
    ];
    for (const [title, keyFn] of groups) {
      const m = new Map();
      for (const h of currentHoldings) { const k = keyFn(h); m.set(k, [...(m.get(k) || []), h]); }
      const rows = [...m.entries()].map(([k, list]) => ({ k, ...totals(list) })).sort((a, b) => b.value - a.value);
      const tbody = el('tbody');
      for (const r of rows) {
        const share = r.value / t.value;
        const bar = el('div', { class: 'level-bar', style: 'margin-top:4px;height:6px' });
        bar.append(el('i', { style: 'width:' + (share * 100).toFixed(1) + '%' }));
        tbody.append(el('tr', null,
          el('td', null, el('div', { text: r.k }), bar),
          el('td', { class: 'num', text: (share * 100).toFixed(1) + '%' }),
          el('td', { class: 'num', text: fmt(r.value) }),
          el('td', { class: 'num ' + tone(r.pnl), text: pct(r.rate, 1) })
        ));
      }
      host.append(el('div', { class: 'table-wrap', style: 'margin-bottom:14px' }, el('table', null,
        el('thead', null, el('tr', null,
          el('th', { text: title }), el('th', { class: 'num', text: '占比' }), el('th', { class: 'num', text: '現值' }), el('th', { class: 'num', text: '報酬率' })
        )), tbody)));
    }
  }

  function renderTrendSelect() {
    const sel = $('trendFund');
    const names = [...new Set(records.flatMap((r) => r.holdings.map((h) => h.name)))];
    sel.replaceChildren(el('option', { value: '', text: '全部帳戶合計' }), ...names.map((n) => el('option', { value: n, text: n })));
    try { const v = sessionStorage.getItem('trendFund'); if (v && names.includes(v)) sel.value = v; } catch (e) { /* ignore */ }
  }
  $('trendFund').addEventListener('change', () => {
    try { sessionStorage.setItem('trendFund', $('trendFund').value); } catch (e) { /* ignore */ }
    renderTrend();
  });

  function renderTrend() {
    const host = $('trendChart');
    host.replaceChildren();
    const data = series($('trendFund').value || null);
    const tbody = $('trendTable').querySelector('tbody');
    tbody.replaceChildren();
    for (const s of [...data].reverse()) {
      const pnl = s.value - s.cost;
      tbody.append(el('tr', null,
        el('td', { text: sl(s.date) }),
        el('td', { class: 'num', text: fmt(s.value) }),
        el('td', { class: 'num', text: fmt(s.cost) }),
        el('td', { class: 'num ' + tone(pnl), text: signed(pnl) }),
        el('td', { class: 'num ' + tone(pnl), text: pct(s.cost ? pnl / s.cost : 0) }),
        el('td', { class: 'num ' + (s.navRate == null ? '' : toneR(s.navRate)), text: s.navRate == null ? '—' : pct(s.navRate) })
      ));
    }
    if (!data.length) { host.append(el('div', { class: 'empty', text: '尚無紀錄' })); return; }

    const W = Math.max(300, host.clientWidth || 800);
    const H = W < 500 ? 220 : 260;
    const m = { t: 12, r: 64, b: 28, l: 48 };
    const iw = W - m.l - m.r, ih = H - m.t - m.b;
    const times = data.map((d) => Date.parse(d.date + 'T00:00:00'));
    const t0 = times[0], t1 = times[times.length - 1];
    const x = (t) => (t1 === t0 ? m.l + iw / 2 : m.l + ((t - t0) / (t1 - t0)) * iw);
    const vals = data.flatMap((d) => [d.value, d.cost]);
    let lo = Math.min(...vals), hi = Math.max(...vals);
    const span = Math.max(hi - lo, hi * 0.1);
    lo = Math.max(0, lo - span * 0.15); hi = hi + span * 0.15;
    const step = niceStep(hi - lo, 4);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    const y = (v) => m.t + ih - ((v - lo) / (hi - lo)) * ih;

    const svg = sv('svg', { viewBox: '0 0 ' + W + ' ' + H, role: 'img', 'aria-label': '參考現值與投入本金走勢' });
    for (let v = lo; v <= hi + 1e-6; v += step) {
      svg.append(sv('line', { x1: m.l, x2: W - m.r, y1: y(v), y2: y(v), stroke: v === lo ? 'var(--axis)' : 'var(--grid)', 'stroke-width': 1 }));
      const tx = sv('text', { x: m.l - 8, y: y(v) + 4, 'text-anchor': 'end', 'font-size': 11, fill: 'var(--muted)', style: 'font-variant-numeric:tabular-nums' });
      tx.textContent = compactTWD(v); svg.append(tx);
    }
    const idxs = new Set([0, data.length - 1]);
    const n = Math.min(4, data.length - 2);
    for (let i = 1; i <= n; i++) idxs.add(Math.round((i * (data.length - 1)) / (n + 1)));
    const multiYear = data[0].date.slice(0, 4) !== data[data.length - 1].date.slice(0, 4);
    for (const i of idxs) {
      const anchor = data.length === 1 ? 'middle' : i === 0 ? 'start' : i === data.length - 1 ? 'end' : 'middle';
      const tx = sv('text', { x: x(times[i]), y: H - 8, 'text-anchor': anchor, 'font-size': 11, fill: 'var(--muted)' });
      tx.textContent = multiYear ? data[i].date.slice(2).replace(/-/g, '/') : data[i].date.slice(5).replace('-', '/');
      svg.append(tx);
    }
    const ser = [
      { key: 'value', name: '參考現值', color: 'var(--series-value)' },
      { key: 'cost', name: '投入本金', color: 'var(--series-cost)' }
    ];
    if (data.length > 1) {
      let dArea = 'M' + data.map((d, i) => x(times[i]) + ',' + y(d.value)).join('L');
      dArea += 'L' + data.map((d, i) => i).reverse().map((i) => x(times[i]) + ',' + y(data[i].cost)).join('L') + 'Z';
      svg.append(sv('path', { d: dArea, fill: 'var(--series-value)', opacity: .08 }));
      for (const s of ser) {
        svg.append(sv('path', { d: 'M' + data.map((p, i) => x(times[i]) + ',' + y(p[s.key])).join('L'), fill: 'none', stroke: s.color, 'stroke-width': 2, 'stroke-linejoin': 'round', 'stroke-linecap': 'round' }));
      }
    }
    const last = data[data.length - 1];
    const lx = x(times[times.length - 1]);
    for (const s of ser) svg.append(sv('circle', { cx: lx, cy: y(last[s.key]), r: 4, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 2 }));
    const ly = [y(last.value), y(last.cost)];
    if (Math.abs(ly[0] - ly[1]) < 14) { const mid = (ly[0] + ly[1]) / 2; const up = ly[0] <= ly[1]; ly[0] = mid + (up ? -8 : 8); ly[1] = mid + (up ? 8 : -8); }
    ser.forEach((s, i) => {
      const t = sv('text', { x: lx + 8, y: ly[i] + 4, 'font-size': 11, fill: 'var(--ink-2)', style: 'font-variant-numeric:tabular-nums' });
      t.textContent = compactTWD(last[s.key]); svg.append(t);
    });

    const cross = sv('line', { y1: m.t, y2: m.t + ih, stroke: 'var(--axis)', 'stroke-width': 1, visibility: 'hidden' });
    const dots = ser.map((s) => sv('circle', { r: 4, fill: s.color, stroke: 'var(--surface)', 'stroke-width': 2, visibility: 'hidden' }));
    svg.append(cross, ...dots);
    const hit = sv('rect', { x: m.l - 10, y: 0, width: iw + 20, height: H, fill: 'transparent', tabindex: '0', 'aria-label': '走勢圖，可用左右鍵瀏覽' });
    svg.append(hit);
    const tip = el('div', { class: 'tooltip' });
    let focusIdx = data.length - 1;
    const showAt = (i, evt) => {
      const d = data[i], cx = x(times[i]);
      cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.setAttribute('visibility', 'visible');
      ser.forEach((s, k) => { dots[k].setAttribute('cx', cx); dots[k].setAttribute('cy', y(d[s.key])); dots[k].setAttribute('visibility', 'visible'); });
      const pnl = d.value - d.cost;
      tip.replaceChildren(
        el('div', { class: 'tt-title', text: sl(d.date) }),
        ttRow('var(--series-value)', '參考現值', fmt(d.value)),
        ttRow('var(--series-cost)', '投入本金', fmt(d.cost)),
        ttRow(null, '損益', signed(pnl) + '（' + pct(d.cost ? pnl / d.cost : 0) + '）', tone(pnl)),
        d.navRate == null ? null : ttRow(null, '淨值變動', pct(d.navRate), toneR(d.navRate))
      );
      const box = host.getBoundingClientRect(), scale = box.width / W;
      if (evt && evt.clientX != null) placeTip(host, tip, evt.clientX - box.left, evt.clientY - box.top);
      else placeTip(host, tip, cx * scale, y(d.value) * scale);
    };
    const nearest = (evt) => {
      const box = svg.getBoundingClientRect();
      const px = (evt.clientX - box.left) * (W / box.width);
      let best = 0, bd = Infinity;
      times.forEach((t, i) => { const dd = Math.abs(x(t) - px); if (dd < bd) { bd = dd; best = i; } });
      return best;
    };
    const hide = () => { tip.classList.remove('show'); cross.setAttribute('visibility', 'hidden'); dots.forEach((d) => d.setAttribute('visibility', 'hidden')); };
    hit.addEventListener('pointermove', (e) => { focusIdx = nearest(e); showAt(focusIdx, e); });
    hit.addEventListener('pointerleave', hide);
    hit.addEventListener('focus', () => showAt(focusIdx));
    hit.addEventListener('blur', hide);
    hit.addEventListener('keydown', (e) => {
      if (e.key === 'ArrowLeft') { focusIdx = Math.max(0, focusIdx - 1); showAt(focusIdx); e.preventDefault(); }
      if (e.key === 'ArrowRight') { focusIdx = Math.min(data.length - 1, focusIdx + 1); showAt(focusIdx); e.preventDefault(); }
    });
    host.append(svg, tip);
    if (data.length === 1) host.append(el('div', { class: 'note', text: '目前只有一個日期的紀錄，之後每次上傳截圖都會多一個點。' }));
  }

  function renderLog() {
    const tbody = $('logTable').querySelector('tbody');
    tbody.replaceChildren();
    $('logMeta').textContent = records.length + ' 筆';
    for (const rec of [...records].reverse()) {
      const t = totals(rec.holdings);
      const d = diffRecords(prevRecord(rec), rec);
      const changeText = d.first ? '首筆紀錄' : d.changes.length ? d.changes.join('；') : '無變動（純淨值）';
      tbody.append(el('tr', null,
        el('td', { text: sl(rec.date) }),
        el('td', { text: accName(rec.account), style: 'text-align:left' }),
        el('td', { class: 'num', text: fmt(t.value) }),
        el('td', { class: 'num', text: fmt(t.cost) }),
        el('td', { class: 'num ' + (d.first ? '' : tone(d.navGain)), text: d.first ? '—' : signed(d.navGain) + '（' + pct(d.navRate) + '）' }),
        el('td', { class: 'changes', text: changeText })
      ));
    }
  }

  let rt;
  window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { renderFundChart(); renderTrend(); }, 120); });
  render();
})();
</script>
</body>
</html>
